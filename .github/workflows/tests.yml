name: Testes

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar projeto
        run: python -m pip install -e .

      - name: Executar testes
        run: python -m unittest discover -s tests -v

      - name: Validar JavaScript da interface
        run: node --check src/candle_lab/web/static/app.js

      - name: Validar iniciadores PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($script in @("iniciar.ps1", "validar-pregao-completo.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "Erros em $script"
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
